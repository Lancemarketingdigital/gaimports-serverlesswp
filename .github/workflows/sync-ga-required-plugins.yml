name: Sync GA Required Plugins

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-plugins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download exact official releases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ga-plugins wp/wp-content/plugins
          curl --fail --location --retry 3 --connect-timeout 20 \
            -o /tmp/ga-plugins/code-snippets.zip \
            https://downloads.wordpress.org/plugin/code-snippets.3.9.6.zip
          curl --fail --location --retry 3 --connect-timeout 20 \
            -o /tmp/ga-plugins/trustindex.zip \
            https://downloads.wordpress.org/plugin/wp-reviews-plugin-for-google.13.3.2.zip
          rm -rf wp/wp-content/plugins/code-snippets wp/wp-content/plugins/wp-reviews-plugin-for-google
          unzip -q /tmp/ga-plugins/code-snippets.zip -d wp/wp-content/plugins
          unzip -q /tmp/ga-plugins/trustindex.zip -d wp/wp-content/plugins
          grep -q 'Version:.*3.9.6' wp/wp-content/plugins/code-snippets/code-snippets.php
          grep -q 'Version: 13.3.2' wp/wp-content/plugins/wp-reviews-plugin-for-google/wp-reviews-plugin-for-google.php

      - name: Commit official plugin files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Lance Plugin Sync'
          git config user.email 'actions@users.noreply.github.com'
          git add wp/wp-content/plugins/code-snippets wp/wp-content/plugins/wp-reviews-plugin-for-google
          if git diff --cached --quiet; then
            echo 'Plugins already synchronized.'
            exit 0
          fi
          git commit -m 'Add Code Snippets 3.9.6 and Trustindex 13.3.2 official releases'
          git push
